  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px 16px 110px;max-width:640px;margin-inline:auto}
  h1{font-size:20px;margin:0 0 2px}
  h2{font-size:15px;margin:26px 0 8px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
  .sub{color:var(--mute);font-size:13px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .card.off{opacity:.45}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .hd b{flex:1;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
  .hd input{width:22px;height:22px;accent-color:var(--accent)}
  .nm{font-weight:600;margin-bottom:4px;word-break:break-word}
  .pr{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .pr s{font-size:13px;font-weight:400;color:var(--mute);margin-left:6px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid}
  .tag.in{color:var(--good);border-color:#2d6a45;background:#12281d}
  .tag.out{color:var(--bad);border-color:#7a3030;background:#2a1515}
  .tag.limited{color:var(--warn);border-color:#7a5a14;background:#2a2210}
  .tag.sale{color:#60a5fa;border-color:#2c4f87;background:#122036}
  .tag.ended{color:var(--mute);border-color:var(--line);text-decoration:line-through}
  .tag.vic{color:#34d399;border-color:#1f6b52;background:#0f2a22}
  .tag.ship{color:#fb923c;border-color:#7c3f12;background:#2a1708}
  .meta{font-size:12px;color:var(--mute);line-height:1.6}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  button,a.btn{background:#232836;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
  button.on{border-color:var(--accent);background:#1b3a38}
  .opts{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .card.open .opts{display:block}
  .opt{display:block;width:100%;text-align:left;margin-bottom:6px;padding:10px 12px;height:auto;flex-direction:column;align-items:flex-start}
  .opt small{color:var(--mute);display:block;margin-top:2px}
  .opt.on small{color:var(--accent)}
  .sum{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .sum:last-child{border:0}
  .sum.big{font-size:18px;font-weight:700}
  .good{color:var(--good)}.bad{color:var(--bad)}.mute{color:var(--mute)}
  .warn{color:var(--bad);font-size:13px;margin:8px 0}
  .cs{font-size:13px;margin-top:6px}
  .cs div{padding:2px 0}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#12151bf2;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(8px)}
  .bar .t{font-size:12px;color:var(--mute)}
  .bar .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
</style>

const KEY='pc-me-state-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function tags(o){
  if(!o)return '';
  let h='';
  const lab0={in:'In stock',out:'Out of stock',limited:'While supplies last'}[o.st];
  if(lab0)h+='<span class="tag '+o.st+'">'+lab0+(o.st!=='limited'&&String(o.vic||'')!==''?' online':'')+'</span>';
  if(atLocal(o))h+='<span class="tag vic">At my store ('+esc(o.vic)+')</span>';
  else if(needsOrder(o))h+='<span class="tag ship">Order for delivery</span>';
  if(o.sale){const ended=o.se&&new Date(o.se+'T23:59:59')<new Date();
    h+='<span class="tag '+(ended?'ended':'sale')+'">'+(ended?'Sale ended':'Sale'+(o.se?' to '+fmtDate(o.se):''))+'</span>'}
  return h;
}
function meta(o){
  const m=[],sku=(String(o.l||'').match(/MX\d+/)||[])[0];
  if(sku)m.push('SKU: '+sku);
  if(o.rp>o.p)m.push('Was '+money(o.rp)+' (save '+money(o.rp-o.p)+')');
  if(o.wy&&o.wc)m.push(o.wy+' yr warranty '+money(o.wc));
  if(o.stores)m.push('Stock: '+esc(o.stores));
  if(o.ck)m.push('Checked '+fmtDate(o.ck));
  return m.join('<br>');
}
function render(){

    return '<div class="card'+(ST.on[i]?'':' off')+'" id="c'+i+'"><div class="hd"><b>'+esc(p.part)+'</b><input type="checkbox" '+(ST.on[i]?'checked':'')+' data-i="'+i+'" data-act="on"></div>'+

  }).join('');
  totals();
}
function totals(){
  let b=0,w=0;
  D.parts.forEach((p,i)=>{if(ST.on[i]){const o=cur(i);if(o){b+=+o.p||0;w+=+o.wc||0}}});
  const sh=D.ship||0,pre=b+w+sh,tax=pre*D.tax/100,g=pre+tax;
  $('tot').innerHTML=[['Parts',b],['Warranty',w],['Shipping',sh],['Before tax',pre],['Tax '+D.tax+'%',tax]].map(([l,v])=>'<div class="sum"><span>'+l+'</span><span>'+money(v)+'</span></div>').join('')+'<div class="sum big"><span>Grand total</span><span>'+money(g)+'</span></div>';
  $('gt').textContent=money(g);
  $('gtsub').innerHTML='Parts '+money(b)+'<br>Warranty '+money(w);
  const oos=[],ord=[];
  D.parts.forEach((p,i)=>{if(!ST.on[i])return;const o=cur(i);if(!o)return;if(o.st==='out'&&!atLocal(o)&&!needsOrder(o))oos.push(p.part);else if(needsOrder(o))ord.push(p.part)});
  $('warn').innerHTML=(oos.length?'⚠ Out of stock: '+oos.join(', ')+'. ':'')+(ord.length?'<span style="color:#fb923c">📦 Order for delivery (not at my store): '+ord.join(', ')+'.</span>':'');
  cases();
}
const find=re=>{const i=D.parts.findIndex(p=>re.test(p.part));return i<0?null:cur(i)};
function cases(){
  const gpu=find(/gpu|graphics|video/i),cool=find(/cool/i),board=find(/mother|board/i),psu=find(/power|psu/i);
  const R=(ok,t)=>({ok,t});
  const fit=(have,max,what)=>{const d=max-have;return d>=0?R(true,have+' in '+max+' mm ('+(+d.toFixed(1))+' spare)'):R(false,have+' mm is '+(+(-d).toFixed(1))+' mm too '+what+' for '+max+' mm')};
  $('cases').innerHTML=D.cases.map(c=>{
    const r={};
    r.GPU=!gpu||!gpu.len?R(null,'no length'):!c.gpu?R(null,'no limit'):fit(gpu.len,c.gpu,'long');
    r.Cooler=!cool?R(null,'none selected'):cool.rad>0?(cool.rad<=c.rad?R(true,cool.rad+'mm radiator OK (up to '+c.rad+'mm)'):R(false,cool.rad+'mm radiator > '+c.rad+'mm')):cool.h>0?fit(cool.h,c.air,'tall'):R(null,'no size');
    const ffs=c.ff.split(/[\s,]+/).filter(Boolean).map(s=>s.toLowerCase().replace('-',''));
    r.Board=!board||!board.ff?R(null,'no size'):ffs.includes(board.ff.toLowerCase())?R(true,board.ff+' supported'):R(false,board.ff+' not supported');
    r.PSU=!psu||!psu.len?R(null,'no length'):!c.psu?R(null,'no limit'):fit(psu.len,c.psu,'long');
    const v=Object.values(r),bad=v.filter(x=>x.ok===false).length,unk=v.filter(x=>x.ok===null).length;
    const head=bad?'<span class="bad">✗ '+bad+' problem'+(bad>1?'s':'')+'</span>':unk?'<span class="mute">? '+unk+' unchecked</span>':'<span class="good">✓ Everything fits</span>';
    return '<div class="card"><div class="nm">'+esc(c.n)+'</div><div>'+head+'</div><div class="cs">'+Object.entries(r).map(([k,x])=>'<div class="'+(x.ok===true?'good':x.ok===false?'bad':'mute')+'">'+(x.ok===true?'✓ ':x.ok===false?'✗ ':'? ')+k+': '+esc(x.t)+'</div>').join('')+'</div><div class="meta" style="margin-top:6px">'+esc(c.note)+'</div>'+(safeUrl(c.l)?'<div class="row"><a class="btn" href="'+esc(safeUrl(c.l))+'" target="_blank" rel="noopener noreferrer">Open page ↗</a></div>':'')+'</div>';
  }).join('');
}
$('parts').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const i=+b.dataset.i,act=b.dataset.act;
  if(act==='toggle'){$('c'+i).classList.toggle('open');return}
  if(act==='pick'){ST.sel[i]=+b.dataset.j;save();const open=$('c'+i).classList.contains('open');render();if(open)$('c'+i).classList.add('open')}
});
$('parts').addEventListener('change',e=>{
  const el=e.target;if(el.dataset.act!=='on')return;
  ST.on[+el.dataset.i]=el.checked?1:0;save();
  const open=[...document.querySelectorAll('.card.open')].map(c=>c.id);render();open.forEach(id=>$(id)&&$(id).classList.add('open'));
});
$('reset').onclick=()=>{ST={sel:D.parts.map(p=>p.sel),on:D.parts.map(p=>p.on)};save();render()};
render();
</script>
</body>
</html>
